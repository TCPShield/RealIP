plugins {
    id 'java'
    id 'idea'
}

group = 'net.tcpshield.tcpshield'
version = '2.9.0-folia.3'
def pluginVersion = version.toString()

base {
    archivesName = 'TCPShield-Folia'
}

java {
    toolchain {
        // Folia 26.2's baseline is Java 25, and --release 25 below pins the
        // bytecode target regardless of compiler version. Requiring JDK 25
        // (rather than 26) lets the plugin build on the same JDK that runs it.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url = 'https://repo.opencollab.dev/maven-snapshots/'
    }
    maven {
        url = 'https://repo.opencollab.dev/maven-releases/'
    }
}

dependencies {
    // Exact Paper/Folia API build used by the Luxorium 26.2 plugin suite.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.92-stable'

    // Retained for compatibility on non-Folia Bukkit servers. Folia always uses
    // Paper's native handshake event and never selects the ProtocolLib handler.
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'

    compileOnly 'net.md-5:bungeecord-api:1.21-R0.3'
    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    compileOnly 'org.geysermc.floodgate:api:2.2.5-20260629.182344-18'

    testImplementation platform('org.junit:junit-bom:6.1.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-Xlint:deprecation')
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property('version', pluginVersion)
    filesMatching(['plugin.yml', 'bungee.yml', 'velocity-plugin.json']) {
        expand(version: pluginVersion)
    }
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
}
